[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "yosoi"
dynamic = ["version"]
description = "Python SDK for Yosoi, backed by the public Rust SDK."
readme = "python/README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
dependencies = ["pydantic>=2.12,<3"]

[dependency-groups]
dev = [
    "build>=1.3,<2",
    "maturin>=1.15,<2",
    "pytest>=8,<10",
    "ruff>=0.14,<1",
    "ty>=0.0.1,<1",
]

[tool.maturin]
manifest-path = "crates/yosoi-python/Cargo.toml"
python-source = "python"
module-name = "yosoi._native"
bindings = "pyo3"
features = ["browser"]
include = [{ path = "rust-toolchain.toml", format = "sdist" }]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py312"
src = ["python"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ty.environment]
extra-paths = ["python"]
