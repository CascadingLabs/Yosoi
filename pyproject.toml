[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[project]
name = "yosoi"
dynamic = ["version"]
description = "Python SDK for Yosoi, backed by the public Rust SDK."
readme = "python/README.md"
requires-python = ">=3.12,<3.16"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["pydantic>=2.14,<3"]

[dependency-groups]
dev = [
    "build==1.6.1",
    "maturin==1.15.0",
    "pytest==9.1.1",
    "ruff==0.17.0",
    "ty==0.0.86",
]

[tool.maturin]
manifest-path = "crates/yosoi-python/Cargo.toml"
python-source = "python"
module-name = "yosoi._native"
bindings = "pyo3"
features = ["browser"]
include = [
    { path = "rust-toolchain.toml", format = "sdist" },
    { path = "LICENSE", format = "sdist" },
]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py312"
src = ["python"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ty.environment]
extra-paths = ["python"]
