[package]
name = "yosoi"
version = "0.1.2"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The modular Rust SDK for Yosoi."
repository = "https://github.com/CascadingLabs/Yosoi"
readme = "README.md"

[package.metadata.yosoi]
sdk = true

[[bin]]
name = "yosoi"
path = "src/bin/yosoi/main.rs"
required-features = ["cli"]

[[example]]
name = "generate-cdp"
path = "src/internal/browser/vendor/chromiumoxide_cdp/examples/generate.rs"

[features]
default = []
browser = [
    "dep:async-tungstenite",
    "dep:chromiumoxide_types",
    "dep:dunce",
    "dep:fnv",
    "dep:futures",
    "dep:futures-timer",
    "dep:globset",
    "dep:image",
    "dep:notify",
    "dep:pin-project-lite",
    "dep:reqwest",
    "dep:rustls",
    "dep:schemars",
    "dep:tempfile",
    "dep:tracing",
    "dep:which",
    "dep:windows-registry",
    "tokio/full",
]
cli = ["browser", "dep:anyhow", "dep:anstream", "dep:unicode-width", "dep:clap", "dep:clap_complete", "tokio/signal"]
scanner = ["browser", "dep:infer"]
encode-gif = ["browser", "image/gif"]
encode-ffmpeg = ["browser"]

[dependencies]
async-tungstenite = { workspace = true, optional = true }
anstream = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
async-compression = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
chromiumoxide_types = { workspace = true, optional = true }
chrono = { workspace = true }
clap = { workspace = true, optional = true }
clap_complete = { workspace = true, optional = true }
dunce = { workspace = true, optional = true }
encoding_rs = { workspace = true }
fnv = { workspace = true, optional = true }
flate2 = { workspace = true }
futures = { workspace = true, optional = true }
futures-timer = { workspace = true, optional = true }
futures-util = { workspace = true }
globset = { workspace = true, optional = true }
html5ever = { workspace = true }
image = { workspace = true, features = ["jpeg", "png"], optional = true }
infer = { workspace = true, optional = true }
libc = { workspace = true }
markup5ever_rcdom = { workspace = true }
memchr = { workspace = true }
notify = { workspace = true, optional = true }
pin-project-lite = { workspace = true, optional = true }
publicsuffix = { workspace = true }
rayon = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls-no-provider"], optional = true }
roxmltree = { workspace = true, features = ["positions"] }
rustix = { workspace = true }
rustls = { workspace = true, features = ["ring", "std", "tls12"], optional = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
sha2 = { workspace = true }
simdutf8 = { workspace = true }
tempfile = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true, optional = true }
unicode-width = { workspace = true, optional = true }
url = { workspace = true, features = ["serde"] }
uuid = { workspace = true }
which = { workspace = true, optional = true }
wreq = { workspace = true }
yosoi-contracts-derive = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-registry = { workspace = true, optional = true }

[dev-dependencies]
chromiumoxide_pdl = { workspace = true }
flate2 = { workspace = true }
proptest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "net", "sync", "test-util"] }
tokio-rustls = { workspace = true }
tokio-util = { workspace = true }
toml = { workspace = true }
url = { workspace = true }

[lints]
workspace = true

[[test]]
name = "cli"
required-features = ["cli"]

[[test]]
name = "cli_journey"
required-features = ["cli"]

[[test]]
name = "completions_cli"
required-features = ["cli"]

[[test]]
name = "locate_cli"
required-features = ["cli"]

[[test]]
name = "map_cli"
required-features = ["cli"]

[[test]]
name = "policy_cli"
required-features = ["cli"]

[[test]]
name = "request_cli"
required-features = ["cli"]
