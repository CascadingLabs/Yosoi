[package]
name = "yosoi-web-capture"
version = "0.1.0-rc.7"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
autobenches = false

[features]
default = []
browser = ["dep:void_crawl_core", "dep:tokio", "dep:tokio-util", "dep:tempfile"]

[dependencies]
encoding_rs.workspace = true
chrono.workspace = true
regex.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
url.workspace = true
yosoi-types.workspace = true
void_crawl_core = { workspace = true, optional = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"], optional = true }
tokio-util = { workspace = true, features = ["rt"], optional = true }
tempfile = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "sync"] }
tokio-util.workspace = true

[lints]
workspace = true
