# Everyday Rust correctness CI: PRs, main, release tags, and manual runs execute
# the full non-ignored suite rather than guessing which tests a diff affects.
# Ordinary default-feature builds and all-feature LLVM coverage have separate
# caches. Cargo caches include downloaded dependencies and compiled artifacts,
# keyed by compiler identity, manifests, lockfile, and build configuration.
# Build checks link all targets (including examples/benchmark harnesses); benchmarks
# are not measured here. Nextest runs unit/integration tests; Cargo runs doctests.
# Run each serial test suite through all failures so an early browser regression
# does not hide later failures behind another complete rebuild.
# Browser tests use regular Chrome Stable with its sandbox enabled and Xvfb so
# headful assertions execute. This is regression evidence, not browser promotion:
# certification remains governed by docs/chromium-cdp-baseline.md.
# Ignored soak/live-network/local-fixture tests remain opt-in; subprocess helper
# tests are invoked by their parent tests. Coverage reports maintained crates,
# excluding vendored code, xtask, and benchmark harnesses, with no percentage gate.
# Rust API Reference stays independent. Future Python/benchmark CI gets its own
# workflow. Require the stable "Rust CI result" job in branch protection.
name: Rust CI Test

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_BUILD_JOBS: '1'
  CARGO_INCREMENTAL: '0'
  RAYON_NUM_THREADS: '1'
  RUST_TEST_THREADS: '1'
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Format, lint, and build checks
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-ci-setup
        with:
          cache-key: checks-all-features
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Compile and lint all targets and features
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Build all targets and features
        # Unlike Clippy, this also checks code generation and native linking.
        run: cargo build --locked --workspace --all-targets --all-features
      - name: Compile the SDK without optional features
        # Check separately: workspace members can unify optional features.
        run: cargo check --locked --package yosoi --no-default-features
      - name: Check downstream SDK visibility
        run: cargo run --locked --package xtask -- sdk-boundary

  tests:
    name: Tests (${{ matrix.configuration }})
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        configuration: [default, coverage-all-features]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-ci-setup
        with:
          cache-key: ${{ matrix.configuration }}
      - name: Install pinned test and coverage tools
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: cargo-nextest@0.9.106,cargo-llvm-cov@0.9.1
      - name: Install regular Chrome Stable and display prerequisites
        run: |
          sudo apt-get install -y --no-install-recommends xvfb xauth ffmpeg
          curl --fail --silent --show-error --location --proto '=https' \
            https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb \
            --output "$RUNNER_TEMP/google-chrome-stable.deb"
          sudo apt-get install -y --no-install-recommends "$RUNNER_TEMP/google-chrome-stable.deb"
          echo 'CHROME=/usr/bin/google-chrome-stable' >> "$GITHUB_ENV"
      - name: Record browser stack identity
        run: |
          mkdir -p ci-evidence
          {
            echo "Source: $GITHUB_SHA"
            google-chrome-stable --version
            sha256sum /opt/google/chrome/chrome
            sha256sum "$RUNNER_TEMP/google-chrome-stable.deb"
            for manifest in crates/voidcrawl/Cargo.toml vendor/chromiumoxide/Cargo.toml vendor/chromiumoxide_cdp/Cargo.toml; do
              echo "$manifest"
              sed -n '/^name = /p; /^version = /p' "$manifest"
            done
            sha256sum vendor/chromiumoxide_cdp/VENDORING.md
          } | tee ci-evidence/browser-identity.txt
      - name: Run default-feature unit and integration tests
        if: matrix.configuration == 'default'
        run: xvfb-run -a cargo nextest run --locked --workspace --test-threads 1 --no-fail-fast
      - name: Run default-feature doctests
        if: matrix.configuration == 'default'
        run: xvfb-run -a cargo test --locked --workspace --doc -- --test-threads=1
      - name: Clear cached coverage profiles
        if: matrix.configuration == 'coverage-all-features'
        run: cargo llvm-cov clean --workspace
      - name: Run all-feature tests with LLVM coverage
        if: matrix.configuration == 'coverage-all-features'
        run: xvfb-run -a cargo llvm-cov nextest --locked --workspace --all-features --test-threads 1 --no-fail-fast --no-report
      - name: Run all-feature doctests
        if: matrix.configuration == 'coverage-all-features'
        # Doctests are correctness checked separately; the stable coverage report
        # covers unit/integration tests and does not claim doctest instrumentation.
        run: xvfb-run -a cargo test --locked --workspace --all-features --doc -- --test-threads=1
      - name: Generate coverage reports
        if: matrix.configuration == 'coverage-all-features'
        run: |
          mkdir -p coverage
          exclusions='(^|/)(vendor|benchmarks|xtask)/'
          cargo llvm-cov report --ignore-filename-regex "$exclusions" --summary-only > coverage/summary.txt
          cargo llvm-cov report --ignore-filename-regex "$exclusions" --lcov --output-path coverage/lcov.info
          cargo llvm-cov report --ignore-filename-regex "$exclusions" --html --output-dir coverage/html
          {
            echo '### Rust unit/integration test coverage (all features)'
            echo '```text'
            cat coverage/summary.txt
            echo '```'
            echo 'Doctests run separately. Ignored opt-in tests are excluded from this run.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage and browser evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: rust-ci-${{ matrix.configuration }}
          path: |
            coverage/
            ci-evidence/
          retention-days: 7
          if-no-files-found: warn

  result:
    name: Rust CI result
    if: always()
    needs: [checks, tests]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Require every Rust CI job to pass
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
        run: |
          test "$CHECKS_RESULT" = success
          test "$TESTS_RESULT" = success
