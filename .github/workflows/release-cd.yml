name: Release CD

# CI retains its own PR/main workflows. CD only accepts an existing release tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v0.MINOR.PATCH or v0.MINOR.PATCH-rc.N tag on main
        type: string
        required: true
      publish:
        description: Publish after all release checks pass
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Serialize writes per tag; read-only validation need not wait for publishing.
  group: ${{ (github.event_name == 'push' || inputs.publish) && format('release-cd-{0}', inputs.tag || github.ref_name) || format('release-cd-validation-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  CARGO_BUILD_JOBS: '1'
  RAYON_NUM_THREADS: '1'
  CARGO_INCREMENTAL: '0'
  RUSTFLAGS: ''
  CARGO_ENCODED_RUSTFLAGS: ''
  MACOSX_DEPLOYMENT_TARGET: '11.0'

defaults:
  run:
    shell: bash

jobs:
  identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.plan.outputs.version }}
      python_version: ${{ steps.plan.outputs.python_version }}
      candidate: ${{ steps.plan.outputs.candidate }}
      source_commit: ${{ steps.plan.outputs.source_commit }}
      toolchain: ${{ steps.plan.outputs.toolchain }}
      platforms: ${{ steps.plan.outputs.platforms }}
      wheels: ${{ steps.plan.outputs.wheels }}
      wheel_tests: ${{ steps.plan.outputs.wheel_tests }}
      wheel_platforms: ${{ steps.plan.outputs.wheel_platforms }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve checked-out source commit
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/rust-ci-setup
        with:
          cache-key: release-identity
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
      - name: Load workflow tooling for validation against an older tag
        if: github.workflow_sha != steps.source.outputs.commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tooling
          persist-credentials: false
      - name: Resolve immutable release identity and matrix
        id: plan
        env:
          WORKFLOW_SOURCE: ${{ github.workflow_sha }}
          PUBLISH_RELEASE: ${{ github.event_name == 'push' || inputs.publish }}
          TOOLING: ${{ github.workflow_sha != steps.source.outputs.commit && '.release-tooling' || '.' }}
        run: |
          args=()
          if [ "$PUBLISH_RELEASE" = true ]; then args+=(--publish); fi
          uv run --locked --project "$TOOLING/scripts/releases" python "$TOOLING/scripts/cd/release.py" plan --tag "$RELEASE_TAG" --workflow-source "$WORKFLOW_SOURCE" --output release-plan.json "${args[@]}"
      - name: Check finalized release notes and all workspace versions
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          cargo xtask release check "$VERSION"
          uv run --locked --project scripts/releases python scripts/releases/release.py --root . body "$VERSION" > release-notes.md
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-identity
          path: |
            release-plan.json
            release-notes.md
          if-no-files-found: error

  source-ci:
    needs: identity
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
      - name: Require successful main CI for the exact source commit
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ needs.identity.outputs.source_commit }}
        run: |
          uv run --locked --project scripts/releases python scripts/cd/ci.py --repository "$GITHUB_REPOSITORY" --source "$SOURCE_COMMIT"

  sdist:
    needs: identity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.identity.outputs.source_commit }}
          persist-credentials: false
      - name: Load workflow tooling for validation against an older tag
        if: github.workflow_sha != needs.identity.outputs.source_commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tooling
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: sdist
          maturin-version: '1.15.0'
          rust-toolchain: ${{ needs.identity.outputs.toolchain }}
          args: --out dist
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
      - name: Freeze the exported sdist workspace without dependency upgrades
        env:
          TOOLING: ${{ github.workflow_sha != needs.identity.outputs.source_commit && '.release-tooling' || '.' }}
        run: |
          for archive in dist/*.tar.gz; do
            uv run --locked --project "$TOOLING/scripts/releases" python "$TOOLING/scripts/cd/sdist.py" "$archive"
          done
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  wheels:
    needs: [identity, sdist]
    name: Build wheels (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # Independent hosted runners; each build retains one compiler worker.
      max-parallel: 5
      matrix: ${{ fromJSON(needs.identity.outputs.wheel_platforms) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.identity.outputs.source_commit }}
          persist-credentials: false
      - name: Install native prerequisites
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            echo 'LIBCLANG_PATH=C:\Program Files\LLVM\bin' >> "$GITHUB_ENV"
          elif [ "$RUNNER_OS" = macOS ]; then
            echo "LIBCLANG_PATH=$(xcrun --find clang | xargs dirname)/../lib" >> "$GITHUB_ENV"
          fi
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          python-version: ${{ matrix.python }}
      - name: Resolve managed interpreters for the wheel batch
        env:
          BUILD_ABI3: ${{ matrix.abi3_python }}
          BUILD_CP314T: ${{ matrix.cp314t_python }}
          BUILD_ABI3T: ${{ matrix.abi3t_python }}
        run: |
          for kind in ABI3 CP314T ABI3T; do
            selection="BUILD_$kind"
            selected="${!selection}"
            if [ -z "$selected" ]; then continue; fi
            uv python install "$selected"
            release_interpreter=$(uv python find --managed-python "$selected")
            echo "RELEASE_PYTHON_$kind=$release_interpreter" >> "$GITHUB_ENV"
            if [ "$kind" = ABI3 ]; then
              echo "RELEASE_PYTHON=$release_interpreter" >> "$GITHUB_ENV"
            fi
          done
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: release-sdist
          path: source-distribution
      - name: Extract the exact source distribution
        run: |
          uv run --no-project --python "$RELEASE_PYTHON" python - <<'PY'
          import pathlib, tarfile
          archives = list(pathlib.Path('source-distribution').glob('*.tar.gz'))
          if len(archives) != 1:
              raise RuntimeError('Exactly one source distribution is required')
          with tarfile.open(archives[0]) as archive:
              archive.extractall('wheel-source', filter='data')
          roots = list(pathlib.Path('wheel-source').iterdir())
          if len(roots) != 1 or not roots[0].is_dir():
              raise RuntimeError('Source distribution needs one root directory')
          roots[0].rename('sdist-source')
          PY
      - name: Give the wheel batch a fresh cache save key
        run: |
          mkdir -p sdist-source/.generated/ci-cache-key/.cargo
          printf '# Source: %s\n# Run: %s\n# Attempt: %s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > sdist-source/.generated/ci-cache-key/.cargo/config.toml
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-wheels-${{ matrix.target }}-${{ needs.identity.outputs.toolchain }}
          workspaces: sdist-source -> target
          cache-workspace-crates: 'true'
          cache-on-failure: 'true'
      - name: Build Linux abi3 wheel at the manylinux 2.28 baseline
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          maturin-version: '1.15.0'
          sccache: 'true'
          rust-toolchain: ${{ needs.identity.outputs.toolchain }}
          target: ${{ matrix.target }}
          manylinux: '2_28'
          working-directory: sdist-source
          before-script-linux: dnf install -y clang clang-devel cmake ninja-build perl-core pkgconf-pkg-config openssl-devel
          docker-options: -e CARGO_BUILD_JOBS=${{ matrix.build_jobs }} -e RAYON_NUM_THREADS=1 -e CARGO_INCREMENTAL=0 -e RUSTFLAGS= -e CARGO_ENCODED_RUSTFLAGS=
          args: --release --locked --out ../dist --features ${{ matrix.abi3_features }} --interpreter ${{ matrix.abi3_linux_python }}
      - name: Build native macOS or Windows abi3 wheel
        env:
          CARGO_BUILD_JOBS: ${{ matrix.build_jobs }}
        if: runner.os != 'Linux'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          maturin-version: '1.15.0'
          sccache: 'true'
          rust-toolchain: ${{ needs.identity.outputs.toolchain }}
          target: ${{ matrix.target }}
          working-directory: sdist-source
          args: --release --locked --out ../dist --features ${{ matrix.abi3_features }} --interpreter "${{ env.RELEASE_PYTHON_ABI3 }}"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-wheel-${{ matrix.platform }}-abi3
          path: dist/*-abi3-*.whl
          if-no-files-found: error
      - name: Build Linux cp314t wheel at the manylinux 2.28 baseline
        if: runner.os == 'Linux' && matrix.cp314t_python != ''
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          maturin-version: '1.15.0'
          sccache: 'true'
          rust-toolchain: ${{ needs.identity.outputs.toolchain }}
          target: ${{ matrix.target }}
          manylinux: '2_28'
          working-directory: sdist-source
          before-script-linux: dnf install -y clang clang-devel cmake ninja-build perl-core pkgconf-pkg-config openssl-devel
          docker-options: -e CARGO_BUILD_JOBS=${{ matrix.build_jobs }} -e RAYON_NUM_THREADS=1 -e CARGO_INCREMENTAL=0 -e RUSTFLAGS= -e CARGO_ENCODED_RUSTFLAGS=
          args: --release --locked --out ../dist --features ${{ matrix.cp314t_features }} --interpreter ${{ matrix.cp314t_linux_python }}
      - name: Build native macOS or Windows cp314t wheel
        env:
          CARGO_BUILD_JOBS: ${{ matrix.build_jobs }}
        if: runner.os != 'Linux' && matrix.cp314t_python != ''
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          maturin-version: '1.15.0'
          sccache: 'true'
          rust-toolchain: ${{ needs.identity.outputs.toolchain }}
          target: ${{ matrix.target }}
          working-directory: sdist-source
          args: --release --locked --out ../dist --features ${{ matrix.cp314t_features }} --interpreter "${{ env.RELEASE_PYTHON_CP314T }}"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: matrix.cp314t_python != ''
        with:
          name: release-wheel-${{ matrix.platform }}-cp314t
          path: dist/*-cp314t-*.whl
          if-no-files-found: error
      - name: Build Linux abi3t wheel at the manylinux 2.28 baseline
        if: runner.os == 'Linux' && matrix.abi3t_python != ''
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          maturin-version: '1.15.0'
          sccache: 'true'
          rust-toolchain: ${{ needs.identity.outputs.toolchain }}
          target: ${{ matrix.target }}
          manylinux: '2_28'
          working-directory: sdist-source
          before-script-linux: dnf install -y clang clang-devel cmake ninja-build perl-core pkgconf-pkg-config openssl-devel
          docker-options: -e CARGO_BUILD_JOBS=${{ matrix.build_jobs }} -e RAYON_NUM_THREADS=1 -e CARGO_INCREMENTAL=0 -e RUSTFLAGS= -e CARGO_ENCODED_RUSTFLAGS=
          args: --release --locked --out ../dist --features ${{ matrix.abi3t_features }} --interpreter ${{ matrix.abi3t_linux_python }}
      - name: Build native macOS or Windows abi3t wheel
        env:
          CARGO_BUILD_JOBS: ${{ matrix.build_jobs }}
        if: runner.os != 'Linux' && matrix.abi3t_python != ''
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          maturin-version: '1.15.0'
          sccache: 'true'
          rust-toolchain: ${{ needs.identity.outputs.toolchain }}
          target: ${{ matrix.target }}
          working-directory: sdist-source
          args: --release --locked --out ../dist --features ${{ matrix.abi3t_features }} --interpreter "${{ env.RELEASE_PYTHON_ABI3T }}"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: matrix.abi3t_python != ''
        with:
          name: release-wheel-${{ matrix.platform }}-abi3.abi3t
          path: dist/*-abi3.abi3t-*.whl
          if-no-files-found: error

  wheel-tests:
    needs: [identity, wheels]
    name: Installed wheel (${{ matrix.platform }}, ${{ matrix.python }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.identity.outputs.wheel_tests) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.identity.outputs.source_commit }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          python-version: ${{ matrix.python }}
      - name: Resolve the managed interpreter path
        env:
          SELECTED_PYTHON: ${{ matrix.python }}
        run: |
          uv python install "$SELECTED_PYTHON"
          release_interpreter=$(uv python find --managed-python "$SELECTED_PYTHON")
          echo "RELEASE_PYTHON=$release_interpreter" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: release-wheel-${{ matrix.platform }}-${{ matrix.wheel_abi }}
          path: dist
      - name: Test the installed wheel outside the source tree
        run: |
          uv venv --python "$RELEASE_PYTHON" .venv
          uv pip install --python .venv --only-binary=:all: dist/*.whl 'pytest==9.1.1'
          cd "$RUNNER_TEMP"
          uv run --no-project --python "$GITHUB_WORKSPACE/.venv" python -m pytest --import-mode=importlib "$GITHUB_WORKSPACE/python/tests" -q
      - name: Record wheel build evidence
        env:
          EXPECTED_ABI: ${{ matrix.abi }}
          EXPECTED_PYTHON: ${{ matrix.python }}
          SOURCE_COMMIT: ${{ needs.identity.outputs.source_commit }}
        run: |
          uv run --no-project --python .venv python - <<'PY'
          import json, os, platform, sys, sysconfig
          from pathlib import Path
          selected = os.environ['EXPECTED_PYTHON']
          parts = tuple(int(part) for part in selected.removesuffix('t').split('.'))
          if sys.version_info[:len(parts)] != parts:
              raise RuntimeError('Wrong interpreter version')
          free = bool(sysconfig.get_config_var('Py_GIL_DISABLED'))
          if free != os.environ['EXPECTED_ABI'].endswith('t'):
              raise RuntimeError('Wrong interpreter ABI')
          if free and sys._is_gil_enabled():
              raise RuntimeError('Free-threaded interpreter enabled the GIL')
          Path('wheel-evidence.json').write_text(json.dumps(dict(source=os.environ['SOURCE_COMMIT'], python=sys.version, platform=platform.platform(), free_threaded=free), indent=2))
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: evidence-${{ matrix.platform }}-${{ matrix.abi }}
          path: wheel-evidence.json
          if-no-files-found: error

  rust:
    needs: identity
    name: Rust artifacts (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJSON(needs.identity.outputs.platforms) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.identity.outputs.source_commit }}
          persist-credentials: false
      - name: Install native prerequisites and toolchain
        env:
          TOOLCHAIN: ${{ needs.identity.outputs.toolchain }}
          TARGET: ${{ matrix.target }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends cmake clang libclang-dev ninja-build pkg-config libssl-dev
          elif [ "$RUNNER_OS" = Windows ]; then
            echo 'LIBCLANG_PATH=C:\Program Files\LLVM\bin' >> "$GITHUB_ENV"
          fi
          rustup toolchain install "$TOOLCHAIN" --profile minimal --target "$TARGET"
      - name: Give native builds a fresh cache save key
        run: |
          mkdir -p .generated/ci-cache-key/.cargo
          printf '# Source: %s\n# Run: %s\n# Attempt: %s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > .generated/ci-cache-key/.cargo/config.toml
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-rust-${{ matrix.target }}-${{ needs.identity.outputs.toolchain }}
          cache-workspace-crates: 'true'
          cache-on-failure: 'true'
      - name: Build and test native Rust artifacts
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
          CARGO_BUILD_JOBS: ${{ matrix.build_jobs }}
        run: |
          cargo test --locked --target "$TARGET" -p yosoi --test public_sdk -- --test-threads=1
          cargo build --release --locked --target "$TARGET" -p yosoi-cli
          mkdir -p dist
          executable="target/$TARGET/release/yosoi"
          if [ "$RUNNER_OS" = Windows ]; then executable="$executable.exe"; fi
          "$executable" --version
          archive="yosoi-$RELEASE_TAG-$PLATFORM.tar.gz"
          uv run --locked --project scripts/releases python scripts/cd/archive.py --executable "$executable" --output "dist/$archive"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-cli-${{ matrix.platform }}
          path: dist/*.tar.gz
          if-no-files-found: error

  reference:
    needs: identity
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.identity.outputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/rust-ci-setup
        with:
          cache-key: release-api-reference
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24.21.0'
      - name: Generate and verify the release API reference
        env:
          SOURCE_COMMIT: ${{ needs.identity.outputs.source_commit }}
          VERSION: ${{ needs.identity.outputs.version }}
        run: |
          channel=$(node -p 'require("./scripts/docs/reference/toolchain.json").channel')
          rustup toolchain install "$channel" --profile minimal
          node scripts/docs/reference/generate.mjs generate --source "$SOURCE_COMMIT" --repository "$GITHUB_REPOSITORY" --sdk yosoi --version "$VERSION" --locales en --out .generated/reference-release
          node scripts/docs/reference/generate.mjs verify --dir .generated/reference-release
          node scripts/docs/reference/generate.mjs pack --dir .generated/reference-release --out .generated/reference.tar
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-reference
          path: .generated/reference.tar
          if-no-files-found: error

  docs:
    needs: [identity, reference]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.identity.outputs.source_commit }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24.21.0'
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: release-reference
          path: reference
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Install pinned docs tooling
        run: cd scripts/docs && bun install --frozen-lockfile
      - name: Export versioned public content and compiler reference
        env:
          SOURCE_COMMIT: ${{ needs.identity.outputs.source_commit }}
          VERSION: ${{ needs.identity.outputs.version }}
        run: |
          mkdir -p .generated/release-reference dist
          tar -xf reference/reference.tar -C .generated/release-reference
          node scripts/docs/bundle.mjs create --source "$SOURCE_COMMIT" --version "$VERSION" --reference .generated/release-reference --out docs-content
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner --mode=u+rwX,go+rX,go-w -cf - -C docs-content . | gzip -n > "dist/yosoi-docs-v$VERSION.tar.gz"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-docs
          path: dist/*.tar.gz
          if-no-files-found: error

  containers:
    needs: identity
    uses: ./.github/workflows/chromium-images.yml
    with:
      source_commit: ${{ needs.identity.outputs.source_commit }}

  verify:
    needs: [identity, source-ci, sdist, wheels, wheel-tests, rust, docs, containers]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.identity.outputs.source_commit }}
          persist-credentials: false
      - name: Load workflow tooling for validation against an older tag
        if: github.workflow_sha != needs.identity.outputs.source_commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tooling
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: release-wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: release-sdist
          path: dist
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
      - name: Check matrix completeness
        env:
          TOOLING: ${{ github.workflow_sha != needs.identity.outputs.source_commit && '.release-tooling' || '.' }}
        run: |
          uv run --locked --project "$TOOLING/scripts/releases" python "$TOOLING/scripts/cd/release.py" verify --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: verified-python-distributions
          path: dist/*
          if-no-files-found: error

  publication-ready:
    needs: [identity, verify]
    if: needs.identity.outputs.candidate != 'true' && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.identity.outputs.source_commit }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
      - name: Check registry publication prerequisites before any upload
        run: |
          uv run --locked --project scripts/releases python scripts/cd/release.py publication-ready --tag "$RELEASE_TAG"

  crates:
    needs: [identity, publication-ready]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.identity.outputs.source_commit }}
          persist-credentials: false
      - uses: ./.github/actions/rust-ci-setup
        with:
          cache-key: release-crate-packaging
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          uv run --locked --project scripts/releases python scripts/cd/publish.py crates --tag "$RELEASE_TAG"

  pypi:
    needs: [identity, crates]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.identity.outputs.source_commit }}
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: verified-python-distributions
          path: dist
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
      - name: Verify any existing PyPI files before retrying
        id: pending
        run: |
          uv run --locked --project scripts/releases python scripts/cd/release.py pypi-pending --tag "$RELEASE_TAG" --output pending
          if [ -n "$(find pending -type f -print -quit)" ]; then echo 'upload=true' >> "$GITHUB_OUTPUT"; fi
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        if: steps.pending.outputs.upload == 'true'
        with:
          packages-dir: pending

  installed:
    needs: [identity, pypi]
    name: Published install (${{ matrix.platform }}, ${{ matrix.python }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.identity.outputs.wheel_tests) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.identity.outputs.source_commit }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          python-version: ${{ matrix.python }}
      - name: Resolve the managed interpreter path
        env:
          SELECTED_PYTHON: ${{ matrix.python }}
        run: |
          uv python install "$SELECTED_PYTHON"
          release_interpreter=$(uv python find --managed-python "$SELECTED_PYTHON")
          echo "RELEASE_PYTHON=$release_interpreter" >> "$GITHUB_ENV"
      - name: Test a clean binary-only installation from PyPI
        env:
          VERSION: ${{ needs.identity.outputs.python_version }}
        run: |
          uv venv --python "$RELEASE_PYTHON" .venv
          uv pip install --python .venv --index-url https://pypi.org/simple --no-cache --only-binary=:all: "yosoi==$VERSION" 'pytest==9.1.1'
          cd "$RUNNER_TEMP"
          uv run --no-project --python "$GITHUB_WORKSPACE/.venv" python -m pytest --import-mode=importlib "$GITHUB_WORKSPACE/python/tests" -q

  container_publish:
    needs: [identity, verify, installed]
    if: >-
      always() && needs.identity.result == 'success' && needs.verify.result == 'success' &&
      (github.event_name == 'push' || inputs.publish) &&
      (needs.identity.outputs.candidate == 'true' || needs.installed.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.identity.outputs.source_commit }}
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: release-container-*
          path: containers
          merge-multiple: true
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish smoke-tested images without rebuilding
        env:
          VERSION: ${{ needs.identity.outputs.version }}
        run: |
          uv run --locked --project scripts/releases python scripts/cd/containers.py publish --directory containers --version "$VERSION" --repository ghcr.io/cascadinglabs/chromium-cdp

  github:
    needs: [identity, verify, installed, container_publish]
    if: >-
      always() && needs.identity.result == 'success' && needs.verify.result == 'success' &&
      needs.container_publish.result == 'success' &&
      (github.event_name == 'push' || inputs.publish) &&
      (needs.identity.outputs.candidate == 'true' || needs.installed.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.identity.outputs.source_commit }}
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: verified-python-distributions
          path: dist
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: release-cli-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: release-docs
          path: dist
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: release-identity
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
      - name: Publish checksummed artifacts and finalized notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp release-plan.json dist/
          uv run --locked --project scripts/releases python scripts/cd/release.py checksums --tag "$RELEASE_TAG" > dist/SHA256SUMS
          uv run --locked --project scripts/releases python scripts/cd/publish.py github --tag "$RELEASE_TAG" --finalize

  publish-docs:
    needs: [identity, github]
    permissions:
      contents: write
    uses: ./.github/workflows/docs-publish.yml
    with:
      source_commit: ${{ needs.identity.outputs.source_commit }}
      version: ${{ needs.identity.outputs.version }}
      bundle_artifact: release-docs
    secrets:
      DOCS_DEPLOY_TOKEN: ${{ secrets.DOCS_DEPLOY_TOKEN }}
