name: Windows wheel diagnostics

on:
  workflow_dispatch:
    inputs:
      release_run:
        description: Existing release CD run containing built wheels
        type: string
        required: true
      source_tag:
        description: Immutable SDK release tag
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {python: '3.12', abi: abi3}
          - {python: '3.14t', abi: cp314t}
          - {python: '3.15.0t', abi: abi3.abi3t}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_tag }}
          persist-credentials: false
      - name: Require wheels from the exact tagged SDK source and release workflow
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.release_run }}
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_TAG" =~ ^v0\.[0-9]+\.[0-9]+(-rc\.[1-9][0-9]*)?$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .head_sha)" = "$(git rev-parse HEAD)"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .path)" = '.github/workflows/release-cd.yml'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.release_run }}
          name: release-wheel-windows-x86_64-${{ matrix.abi }}
          path: dist
      - name: Resolve interpreter and create environment
        env:
          SELECTED_PYTHON: ${{ matrix.python }}
        run: |
          uv python install "$SELECTED_PYTHON"
          interpreter=$(uv python find "$SELECTED_PYTHON")
          uv venv --python "$interpreter" .venv
      - name: Install the built wheel and test dependencies
        run: |
          uv pip install --python .venv --only-binary=:all: dist/*.whl 'pytest==9.1.1'
      - name: Load the diagnostic fixture from the workflow revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .fixture-source
          sparse-checkout: python/tests/test_async_sdk.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Apply only the fixture cleanup under test
        run: cp .fixture-source/python/tests/test_async_sdk.py python/tests/test_async_sdk.py
      - name: Trace cancellation test phases without changing assertions
        run: |
          uv run --no-project --python .venv python - <<'PYTRACE'
          import ast
          from pathlib import Path
          target = Path('python/tests/test_async_sdk.py')
          source = target.read_text()
          marker = 'def test_cancelling_one_task_keeps_its_shared_token_sibling_running()'
          assert source.count(marker) == 1
          prefix, body = source.split(marker, 1)
          traced = []
          for line in body.splitlines(keepends=True):
              statement = line.strip()
              selected = statement.startswith('await ') or '= await ' in statement or statement in (
                  'first.cancel()', 'second.cancel()', 'release.set()', 'ready.set()',
                  'assert not parent.cancelled',
              )
              indent = line[:len(line)-len(line.lstrip())]
              if selected:
                  traced.append(indent + 'print(' + repr('BEFORE: ' + statement) + ', flush=True)\n')
              traced.append(line)
              if selected:
                  traced.append(indent + 'print(' + repr('AFTER: ' + statement) + ', flush=True)\n')
          result = prefix + marker + ''.join(traced)
          ast.parse(result)
          target.write_text(result)
          PYTRACE
      - name: Run the complete installed-wheel suite with verbose diagnostics
        run: |
          cd "$RUNNER_TEMP"
          uv run --no-project --python "$GITHUB_WORKSPACE/.venv" python -X faulthandler -m pytest --import-mode=importlib "$GITHUB_WORKSPACE/python/tests" -vv -s -o faulthandler_timeout=60
