# Shared Linux setup for Rust CI. Keep compiler/dependency/build caches separate
# for ordinary and instrumented builds; never reuse coverage artifacts as normal
# binaries. Toolchain identity comes from rust-toolchain.toml.
name: Rust CI setup
description: Install native prerequisites, the repository toolchain, and a Cargo cache
inputs:
  cache-key:
    description: Build configuration cache namespace
    required: true
  cache-job-id:
    description: Reuse another job's cache namespace when compilation settings match
    default: ''
  cache-save:
    description: Whether this job may update the compiled target cache
    default: 'true'
runs:
  using: composite
  steps:
    - name: Install native build prerequisites
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends cmake clang libclang-dev ninja-build pkg-config libssl-dev
    - name: Install repository Rust toolchain
      shell: bash
      run: |
        channel=$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)
        test -n "$channel"
        rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy --component llvm-tools-preview
        echo "SDK_CHECK_TOOLCHAIN=$channel" >> "$GITHUB_ENV"
        rustc --version --verbose
    - name: Give compiled caches a fresh save key with the existing restore prefix
      shell: bash
      run: |
        # rust-cache hashes nested Cargo config files into the save-key suffix.
        # This comment-only file is outside every crate's ancestor directories:
        # Cargo does not read it as configuration. Failed partial caches can be
        # restored and improved rather than remaining immutable forever.
        mkdir -p .generated/ci-cache-key/.cargo
        printf '# Source: %s\n# Run: %s\n# Attempt: %s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > .generated/ci-cache-key/.cargo/config.toml
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      with:
        key: ${{ inputs.cache-key }}-${{ inputs.cache-job-id || github.job }}
        add-job-id-key: 'false'
        cache-directories: .generated/ci-source-inputs
        workspaces: |
          . -> target
          . -> target/llvm-cov-target
          . -> .generated/rust-reference/target
        cache-workspace-crates: 'true'
        cache-on-failure: 'true'
        # PRs restore main's caches without filling the repository quota with
        # duplicate archives that main cannot restore. Cargo checks fingerprints.
        save-if: ${{ inputs.cache-save == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    # Register after rust-cache so this post step verifies source integrity
    # before rust-cache cleans and saves the paired artifacts and snapshot.
    - uses: ./.github/actions/rust-source-cache
    - name: Install pinned compiler-result cache
      uses: mozilla-actions/sccache-action@fd02668681acd5f960e1372061bee5e3e987195c # v0.0.11
      with:
        version: 'v0.18.0'
    - name: Reuse content-keyed compilation results
      shell: bash
      env:
        CACHE_MODE: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && 'READ_WRITE' || 'READ_ONLY' }}
      run: |
        # Enable after rust-cache so existing target-cache namespaces survive.
        echo "SCCACHE_GHA_RW_MODE=$CACHE_MODE" >> "$GITHUB_ENV"
        echo 'SCCACHE_GHA_ENABLED=true' >> "$GITHUB_ENV"
        echo 'RUSTC_WRAPPER=sccache' >> "$GITHUB_ENV"
    - name: Use two compiler workers on the hosted Linux runner
      shell: bash
      run: |
        # Scheduling does not change compiled code. Set the budget after cache
        # restore so existing single-worker caches keep their restore namespace.
        echo 'CARGO_BUILD_JOBS=2' >> "$GITHUB_ENV"
