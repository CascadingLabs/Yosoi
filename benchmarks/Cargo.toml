[package]
name = "yosoi-benchmarks"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
autobenches = false

[dependencies]
anyhow.workspace = true
chrono.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["io-util", "net"] }
tokio-util.workspace = true
url.workspace = true
wreq.workspace = true
void_crawl_core.workspace = true
yosoi-types.workspace = true
yosoi-web-capture = { workspace = true, features = ["browser"] }
yosoi-web-capture-direct-http.workspace = true

[dev-dependencies]
criterion = { workspace = true, features = ["cargo_bench_support", "plotters"] }
divan.workspace = true
gungraun.workspace = true
proptest.workspace = true
tempfile.workspace = true
yosoi-documents.workspace = true

[[bench]]
name = "allocation_capture"
harness = false

[[bench]]
name = "criterion_capture"
harness = false

[[bench]]
name = "gungraun_capture"
harness = false

[[bench]]
name = "criterion_browser"
harness = false

[[bench]]
name = "allocation_browser"
harness = false

[lints]
workspace = true
