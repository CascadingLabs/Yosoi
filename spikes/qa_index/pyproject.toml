[project]
name = "yosoi-qa-index-spike"
version = "0.0.0"
description = "Spike: headless DOM index with an MDS-coverage gate. Disposable."
requires-python = ">=3.13"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "cssselect>=1.5",
  "httpx>=0.27",
  "lxml>=6.1.1",
  "parsel>=1.11",
  "tenacity>=9.1.4",
  "tiktoken>=0.13",
  "voidcrawl>=0.4",
]

[tool.uv]
# Dogfood the local VoidCrawl tree, not the index build.
# Yosoi's own venv resolves voidcrawl>=0.4 from PyPI (a July build); this spike
# deliberately does not touch that. Python-side edits in ../../../VoidCrawl are live;
# Rust edits need the extension module rebuilt.
sources.voidcrawl = { path = "../../../VoidCrawl", editable = true }

[tool.ruff]
line-length = 100
